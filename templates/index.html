<!DOCTYPE html>
<html>
<head>

<title>JNTU Topper Analyzer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#f4f8fb;
font-size:14px;

}

.container-box{

background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);

}

h2{

margin-top:30px;
margin-bottom:10px;

}

table{

width:80% !important;
margin:auto;

}

</style>

</head>

<body>

<div class="container">

<h1 class="text-center mt-3">JNTU Topper Analyzer</h1>

<div class="container-box text-center">

<form method="POST" enctype="multipart/form-data">

<input type="file" name="file" required class="form-control w-50 mx-auto mb-2">

<button class="btn btn-primary">Upload Excel</button>

<a href="/download" class="btn btn-success">Download Excel</a>

</form>

</div>


{% if marks %}

<div class="container-box">

<h2 class="text-center">Ranking by Total Marks</h2>

{{ marks|safe }}

</div>

{% endif %}


{% if sgpa %}

<div class="container-box">

<h2 class="text-center">Ranking by SGPA</h2>

{{ sgpa|safe }}

</div>

{% endif %}


{% if failed %}

<div class="container-box">

<h2 class="text-center text-danger">Failed Students</h2>

{{ failed|safe }}

</div>

{% endif %}

</div>

</body>
</html>
